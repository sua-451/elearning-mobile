<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background:#0F172A;border-radius:12px;">
  <!-- Header -->
  <text x="30" y="36" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">PAGE ROUTING</text>
  <text x="30" y="60" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Navigator Route Stack (Push &amp; Pop)</text>

  <!-- Left: Navigator Stack -->
  <rect x="40" y="90" width="220" height="200" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
  <text x="150" y="115" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ROUTE STACK</text>

  <!-- Stack items -->
  <!-- Top item (Page 2) -->
  <rect x="55" y="130" width="190" height="42" rx="6" fill="#0175C2" stroke="#54C5F8" stroke-width="1.5"/>
  <text x="150" y="156" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DetailProyekPage</text>
  <text x="150" y="185" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">[Active Top Screen]</text>

  <!-- Bottom item (Page 1) -->
  <rect x="55" y="200" width="190" height="42" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1.2"/>
  <text x="150" y="226" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">DaftarProyekPage</text>
  <text x="150" y="255" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">[Base Screen]</text>

  <!-- Actions (Right side) -->
  <!-- Push Action -->
  <rect x="310" y="105" width="250" height="75" rx="8" fill="#1E293B" stroke="#0175C2" stroke-width="1.5"/>
  <text x="330" y="132" fill="#54C5F8" font-family="monospace" font-size="12" font-weight="700">Navigator.push(context, ...)</text>
  <text x="330" y="155" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12">Menumpuk rute halaman baru</text>
  <text x="330" y="170" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Data dikirim via constructor halaman.</text>

  <!-- Pop Action -->
  <rect x="310" y="200" width="250" height="75" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <text x="330" y="227" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="700">Navigator.pop(context)</text>
  <text x="330" y="250" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12">Menghapus rute teratas</text>
  <text x="330" y="265" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Kembali ke halaman sebelumnya.</text>
</svg>
